<script>
(function(){
var CHUNK=4096;
var BUILD="861323ece3183e64b566f10a";
var LANES=12;
var TRIES=10;
var STALL=5000;
var COOKIE="r4ndom_key";
function screen(){var b=document.createElement("div");
b.style.cssText="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;padding:6vw;text-align:center;font:16px/1.5 system-ui,sans-serif;color:#e9c887;background:#0a0d10";
return b;}
function say(t,d){document.body.innerHTML="";var b=screen();
var h=document.createElement("div");h.style.cssText="font-size:1.25em;font-weight:700";h.textContent=t;
var p=document.createElement("div");p.style.cssText="opacity:.6;font-size:.85em;max-width:34em";p.textContent=d||"";
b.appendChild(h);b.appendChild(p);document.body.appendChild(b);}
var line=null;
function tell(t){if(!line){line=screen();line.style.opacity=".75";document.body.appendChild(line);}
line.textContent=t;}
function bin(h){var a=(h||"").trim().match(/../g)||[],b=new Uint8Array(a.length);for(var i=0;i<a.length;i++)b[i]=parseInt(a[i],16);return b;}
function pause(ms){return new Promise(function(r){setTimeout(r,ms);});}
/* Ссылку на игру теперь шлют словами («royal-poker.online»), и мессенджеры
   открывают её по http. Без https нет crypto.subtle — игра не запустилась
   бы вовсе, поэтому переводим на https сами. Локальные адреса не трогаем:
   сертификата там нет, а crypto.subtle доступен (localhost считается
   защищённым). */
var LOCAL=/^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname||"");
if(location.protocol==="http:"&&!LOCAL){
location.replace("https://"+location.host+location.pathname+location.search+location.hash);return;}
if(!window.crypto||!crypto.subtle){say("Нужен защищённый адрес","Игра открывается только по https. Откройте её по обычной ссылке сайта.");return;}
function grab(url,head,want,ms){
var wait=ms||STALL;
var ac=window.AbortController?new AbortController():null;
var timer=0;
function arm(){if(!ac)return;clearTimeout(timer);timer=setTimeout(function(){try{ac.abort();}catch(e){}},wait);}
var o={credentials:"same-origin"};
if(!head||!head.Range)o.cache="no-store";
if(ac)o.signal=ac.signal;
if(head)o.headers=head;
arm();
return fetch(url,o).then(function(r){
arm();
if(!r.body||!r.body.getReader){
var done=function(v){clearTimeout(timer);return {r:r,v:v};};
if(want==="text")return r.text().then(done);
if(want==="buf")return r.arrayBuffer().then(done);
clearTimeout(timer);return {r:r,v:null};}
if(want!=="text"&&want!=="buf"){clearTimeout(timer);return {r:r,v:null};}
var rd=r.body.getReader(),parts=[],len=0;
function pump(){return rd.read().then(function(c){
if(c.done)return null;
arm();
parts.push(c.value);len+=c.value.length;
return pump();});}
return pump().then(function(){
clearTimeout(timer);
var all=new Uint8Array(len),p=0;
for(var i=0;i<parts.length;i++){all.set(parts[i],p);p+=parts[i].length;}
return {r:r,v:(want==="text")?new TextDecoder().decode(all):all.buffer};});
},function(e){clearTimeout(timer);throw e;});}
function get(url,head,want,ms,n,tries){
tries=tries||TRIES;
n=(n===undefined)?tries:n;
return grab(url,head,want,ms)["catch"](function(e){
if(n<=1)throw "net";
return pause(300+(tries-n)*300).then(function(){return get(url,head,want,ms,n-1,tries);});});}
function piece(from,to){
return get("app.bin?b="+BUILD+"&p="+from,{Range:"bytes="+from+"-"+to},"buf").then(function(g){
if(!g.r.ok)throw "nobin";
var m=/\/(\d+)\s*$/.exec(g.r.headers.get("Content-Range")||"");
return {b:new Uint8Array(g.v),total:m?parseInt(m[1],10):0,part:g.r.status===206};});}
function loadBin(){
tell("Загрузка игры…");
return piece(0,CHUNK-1).then(function(first){
if(!first.part||!first.total||first.total<=first.b.length)return first.b;
var total=first.total;
var out=new Uint8Array(total);
out.set(first.b,0);
var got=first.b.length,next=first.b.length,live=0,failed=null;
return new Promise(function(done,fail){
function pump(){
if(failed){if(live===0)fail(failed);return;}
if(got>=total){if(live===0)done(out);return;}
while(live<LANES&&next<total){
(function(from){
var to=Math.min(from+CHUNK,total)-1;
live++;next=to+1;
piece(from,to).then(function(c){
out.set(c.b,from);got+=c.b.length;
tell("Загрузка игры… "+Math.round(got*100/total)+"%");
live--;pump();
},function(e){failed=e;live--;pump();});
})(next);}
}
pump();});});}
function wholeBin(){
tell("Загрузка игры…");
return get("app.bin?b="+BUILD,null,"buf",STALL,undefined,3).then(function(g){
if(!g.r.ok)throw "nobin";
return new Uint8Array(g.v);});}
function fetchBin(){return wholeBin()["catch"](function(e){if(e!=="net")throw e;return loadBin();});}
var STORE="r4ndom-pkg-"+BUILD;
function cachedBin(){
if(!window.caches)return fetchBin();
var store=null;
return caches.open(STORE).then(function(c){store=c;return c.match("app.bin");})
.then(function(r){return r?r.arrayBuffer():null;})
["catch"](function(){return null;})
.then(function(b){
if(b)return new Uint8Array(b);
return fetchBin().then(function(d){
try{if(store)store.put("app.bin",new Response(d))["catch"](function(){});}catch(e){}
return d;});});}
if(window.caches&&caches.keys){caches.keys().then(function(ks){
ks.forEach(function(k){if(k.indexOf("r4ndom-pkg-")===0&&k!==STORE)caches["delete"](k);});})["catch"](function(){});}
function readCookie(){
var raw="";try{raw=document.cookie||"";}catch(e){return "";}
var parts=raw.split(";");
for(var i=0;i<parts.length;i++){
var eq=parts[i].indexOf("=");if(eq<0)continue;
if(parts[i].slice(0,eq).trim()!==COOKIE)continue;
var v=parts[i].slice(eq+1).trim();
if(v.length>1&&v.charAt(0)==='"'&&v.charAt(v.length-1)==='"')v=v.slice(1,-1);
try{return decodeURIComponent(v);}catch(e){return v;}}
return "";}
function fromLink(){
var v="";
var h=/(?:^#|&)k=([^&]*)/.exec(location.hash||"");
if(h)v=h[1];
if(!v){try{v=new URLSearchParams(location.search).get("k")||"";}catch(e){}}
try{v=decodeURIComponent(v);}catch(e){}
return v.trim();}
function stored(){try{return localStorage.getItem(COOKIE)||"";}catch(e){return "";}}
function remember(s){
var sec=location.protocol==="https:"?"; Secure":"";
try{document.cookie=COOKIE+"="+encodeURIComponent(s)+"; Path=/; Max-Age=31536000; SameSite=Lax"+sec;}catch(e){}
try{localStorage.setItem(COOKIE,s);}catch(e){}}
function tidyAddress(){
try{
var u=location.pathname;
if(u!==location.pathname+location.search+location.hash)history.replaceState(null,"",u);
}catch(e){}}
/* ---- КЛЮЧ ПАКЕТА ----
   Ссылка-приглашение больше не нужна: игру открывает любой, кто зашёл на
   сам сайт. Но ключ от app.bin не лежит в разметке открытым текстом — он
   в k.bin, зашифрованный на «секрете места»:

       секрет = "site:" + домен (www. отбрасывается)

   Домен берётся из адресной строки, поэтому ключ собирается ТОЛЬКО на
   самом сайте. Сохранённая копия, открытая с диска или выложенная на
   чужой домен, до ключа не доберётся: домен другой — запись в k.bin не
   расшифруется, а значит и app.bin останется двоичным шумом. Обойти это
   можно (поднять сервер под нужным именем или переписать загрузчик), но
   это уже не «сохранить страницу в два клика».

   k.bin — НЕСКОЛЬКО записей подряд, по 92 байта каждая (12 байт iv +
   64 символа ключа + 16 байт метки). Перебираем все: так в одном файле
   живут и секрет сайта, и прежний ключ-приглашение (по нему игра
   открывается у тех, кто заходил раньше, и на стендах). */
var REC=92;
function hostSecret(){
var h=(location.hostname||"").toLowerCase().replace(/^www\./,"");
return h?"site:"+h:"";}
function unwrap(s,rec){
return crypto.subtle.digest("SHA-256",new TextEncoder().encode("r4ndom-gate:"+s))
.then(function(h){return crypto.subtle.importKey("raw",h,{name:"AES-GCM"},false,["decrypt"]);})
.then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:rec.slice(0,12)},k,rec.slice(12));})
.then(function(p){return new TextDecoder().decode(p).trim();});}
function openGate(kb){
var recs=[],p=0;
for(p=0;p+REC<=kb.length;p+=REC)recs.push(kb.slice(p,p+REC));
if(!recs.length)recs.push(kb);
var list=[],seen={};
[hostSecret(),fromLink(),readCookie(),stored()].forEach(function(s){if(s&&!seen[s]){seen[s]=1;list.push(s);}});
var i=0,j=0;
function next(){
if(i>=list.length)return Promise.reject("gate");
var s=list[i],rec=recs[j];
j++;if(j>=recs.length){j=0;i++;}
return unwrap(s,rec).then(function(h){
/* Ключ-приглашение запоминаем, секрет места — нет: он и так выводится
   из адреса, а в куке был бы лишним. */
if(s.indexOf("site:")!==0)remember(s);
return h;},next);}
return next();}
var KEY=null;
tell("Соединение…");
get("k.bin?b="+BUILD,null,"buf").then(function(g){
if(!g.r.ok)throw "nokbin";
return openGate(new Uint8Array(g.v));})
.then(function(h){tidyAddress();KEY=(h||"").trim();if(KEY.length!==64)throw "badkey";
return crypto.subtle.importKey("raw",bin(KEY),{name:"AES-GCM"},false,["decrypt"]);})
.then(function(k){return cachedBin().then(function(d){
tell("Почти готово…");
return crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},k,d.slice(12))["catch"](function(){
try{if(window.caches)caches["delete"](STORE)["catch"](function(){});}catch(e){}
throw "mismatch";});});})
.then(function(p){
var o=JSON.parse(new TextDecoder().decode(p));
var s=document.createElement("style");s.textContent=o.css;document.head.appendChild(s);
document.body.innerHTML=o.html;
for(var i=0;i<o.js.length;i++){var t=document.createElement("script");t.textContent=o.js[i];document.body.appendChild(t);}
})["catch"](function(e){
if(e==="gate")say("Игра открывается на royal-poker.online","Эта копия запущена не с сайта игры, поэтому ключ к ней не подходит. Откройте royal-poker.online.");
else if(e==="nokbin")say("Не загрузился файл k.bin","Проверьте, что k.bin лежит в корне сайта рядом с index.html.");
else if(e==="badkey")say("Ключ повреждён","k.bin не от этой сборки. Выложите k.bin и app.bin из одной и той же сборки.");
else if(e==="mismatch")say("Пакет не совпал с ключом","app.bin и k.bin из разных сборок. Выложите оба файла из одной сборки и обновите страницу.");
else if(e==="nobin")say("Не загрузился файл игры","Проверьте, что app.bin лежит в корне сайта.");
else if(e==="net")say("Связь обрывается","Файл игры не доходит целиком. Попробуйте обновить страницу, другую сеть или мобильный интернет.");
else say("Не удалось запустить игру",String(e&&e.message||e||""));
});
})();
</script>
