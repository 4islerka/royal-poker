<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ROYAL-POKER.ONLINE</title>
</head>
<body style="margin:0;background:#0a0d10">
<script>
/* GitHub Pages отдаёт этот файл на ЛЮБОЙ несуществующий адрес.
   Ссылок-приглашений вида royal-poker.online/КЛЮЧ больше нет: игра
   открывается прямо на сайте. Но старые ссылки у людей остались, да и
   опечатка в адресе не должна упираться в пустую страницу — поэтому
   любой неизвестный путь просто ведёт на главную.
   Ключ из старой ссылки по дороге переносим в хвост адреса (#k=…, на
   сервер он не уходит): загрузчик умеет и его. Самого ключа здесь НЕТ —
   эта страница лежит в открытом репозитории. */
(function(){
  var parts = location.pathname.split("/").filter(Boolean);
  var root = "/";
  /* На адресе имя.github.io/репозиторий/ первая часть пути — папка
     сайта, а не ключ. */
  if (/\.github\.io$/i.test(location.hostname) && parts.length) root = "/" + parts.shift() + "/";
  var key = parts.length === 1 ? parts[0] : "";
  try { key = decodeURIComponent(key); } catch (e) {}
  var hash = /^[A-Za-z0-9_-]{6,64}$/.test(key) ? "#k=" + encodeURIComponent(key) : "";
  location.replace(root + hash);
})();
</script>
</body>
</html>
