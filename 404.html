<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ROYAL-POKER.ONLINE</title>
</head>
<body style="margin:0;background:#0a0d10">
<script>
/* GitHub Pages отдаёт этот файл на ЛЮБОЙ несуществующий адрес.
   Приглашения выглядят как royal-poker.online/КЛЮЧ: файла с таким
   именем на сайте нет, поэтому человек попадает сюда. Ключ переносим
   в хвост адреса (#k=…, на сервер он не уходит) и открываем главную,
   а проверяет и запоминает его загрузчик. Самого ключа здесь НЕТ:
   эта страница лежит в открытом репозитории. */
(function(){
  var parts = location.pathname.split("/").filter(Boolean);
  var root = "/";
  /* На адресе имя.github.io/репозиторий/ первая часть пути — папка
     сайта, а не ключ. */
  if (/\.github\.io$/i.test(location.hostname) && parts.length) root = "/" + parts.shift() + "/";
  var key = parts.length === 1 ? parts[0] : "";
  try { key = decodeURIComponent(key); } catch (e) {}
  if (/^[A-Za-z0-9_-]{6,64}$/.test(key)) {
    var m = "";
    try { m = new URLSearchParams(location.search).get("m") || ""; } catch (e) {}
    location.replace(root + (m ? "?m=" + encodeURIComponent(m) : "") + "#k=" + encodeURIComponent(key));
    return;
  }
  document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:16px/1.5 system-ui,sans-serif;color:#e9c887;opacity:.6">Not found</div>';
})();
</script>
</body>
</html>
